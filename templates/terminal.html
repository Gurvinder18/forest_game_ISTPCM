<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Game Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="screen terminal" id="terminal">
    <div class="output" id="output" aria-live="polite"></div>

    <form class="input-line" id="input-form" autocomplete="off">
      <label for="command" class="prompt">&gt;</label>
      <input id="command" name="command" type="text" spellcheck="false" autofocus maxlength="500">
    </form>
  </main>

  <script>window.STREAM_URL = "{{ url_for('terminal_stream') }}"; window.MENU_URL = "{{ url_for('home') }}";</script>
  <script src="{{ url_for('static', filename='js/terminal.js') }}"></script>
</body>
</html>
